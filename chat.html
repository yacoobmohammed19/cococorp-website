<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Chat with CocoCorp's AI assistant. Ask about our website design, SEO, and AI services. Get instant answers 24/7.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="assets/logo.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/logo.png">
<title>Chat with Us | CocoCorp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></noscript>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',sans-serif;background:#06080f;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}

.chat-topbar{
    display:flex;justify-content:space-between;align-items:center;
    padding:0.75rem 1.5rem;
    background:rgba(6,8,15,0.9);backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,0.06);
    flex-shrink:0;z-index:10;
}
.chat-logo{font-size:1.15rem;font-weight:900;letter-spacing:0.06em;text-decoration:none;display:flex;align-items:center;gap:0.75rem}
.chat-logo .c1{color:#EC4899}.chat-logo .c2{color:#2563EB}
.chat-badge{
    font-size:0.65rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
    color:rgba(255,255,255,0.5);background:rgba(255,255,255,0.06);
    padding:0.3rem 0.7rem;border-radius:100px;
}
.chat-nav{display:flex;gap:1rem;align-items:center}
.chat-nav a{
    font-size:0.8rem;font-weight:600;color:rgba(255,255,255,0.5);
    text-decoration:none;transition:color 0.2s;
}
.chat-nav a:hover{color:#fff}
.chat-browse{
    padding:0.5rem 1.2rem;font-size:0.78rem;font-weight:700;
    color:#fff;background:#2563EB;border-radius:100px;
    text-decoration:none;transition:all 0.3s;
}
.chat-browse:hover{background:#1D4ED8;transform:translateY(-1px)}

.chat-embed{flex:1;position:relative;overflow:hidden}
.chat-glow{
    position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;
    background:
        radial-gradient(ellipse 50% 40% at 20% 80%, rgba(37,99,235,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 80% 20%, rgba(236,72,153,0.05) 0%, transparent 70%);
    z-index:0;
}

@media(max-width:600px){
    .chat-nav a:not(.chat-browse){display:none}
    .chat-badge{display:none}
}
</style>
</head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-G3QEERCYFN"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-G3QEERCYFN');</script>
<body>

<div class="chat-topbar">
    <a href="index.html" class="chat-logo">
        <span><span class="c1">COCO</span><span class="c2">CORP</span></span>
        <span class="chat-badge">AI Assistant</span>
    </a>
    <div class="chat-nav">
        <a href="digital-marketing.html">Services</a>
        <a href="ai.html">AI</a>
        <a href="index.html#contact">Contact</a>
        <a href="index.html" class="chat-browse"><i class="fas fa-globe" style="margin-right:0.4rem"></i>Browse Site</a>
    </div>
</div>

<div class="chat-embed">
    <div class="chat-glow"></div>
    <script src="https://app.dante-ai.com/dante-helper.js"></script>
    <iframe
        src="https://app.dante-ai.com/embed/?kb_id=33c23993-a07a-4d66-908d-bccbe9089ded&token=b3456ba8-ce7d-42b4-b8fa-2d3686e90f42"
        allow="clipboard-write; clipboard-read; *;microphone *"
        width="100%" height="100%" frameborder="0"
        style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;z-index:1;">
    </iframe>
</div>

</body>
</html>
