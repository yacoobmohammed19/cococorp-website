<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="CocoCorp AI Training Portal. Interactive modules on AI fundamentals, prompt engineering, and business automation.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="assets/logo.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/logo.png">
<title>AI Training Portal | CocoCorp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#2563EB;--pink:#EC4899;--green:#059669;--gold:#eab308;--text:#0f172a;--text-sec:#64748b;--text-lt:rgba(255,255,255,0.7);--text-faint:rgba(255,255,255,0.35);--bg-alt:#f8fafc;--rad:16px}
html{scroll-behavior:smooth}
body{font-family:'Montserrat',sans-serif;background:#06080f;color:#fff;overflow-x:hidden;min-height:100vh}

/* ══ STARFIELD ══ */
.stars{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:#fff}
.star.tw{animation:twinkle ease-in-out infinite alternate}
@keyframes twinkle{0%{opacity:0.15;transform:scale(0.8)}100%{opacity:1;transform:scale(1.3)}}

/* ══ TOP BAR ══ */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0.7rem 1.5rem;background:rgba(6,8,15,0.88);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.05)}
.topbar-left{display:flex;align-items:center;gap:1rem}
.topbar-logo{font-weight:900;font-size:1.1rem;letter-spacing:0.05em;text-decoration:none}.topbar-logo .c1{color:var(--pink)}.topbar-logo .c2{color:var(--blue)}
.topbar-tag{font-size:0.65rem;font-weight:700;color:var(--text-faint);letter-spacing:0.1em;text-transform:uppercase;background:rgba(255,255,255,0.04);padding:0.3rem 0.7rem;border-radius:100px;border:1px solid rgba(255,255,255,0.06)}
.topbar-right{display:flex;align-items:center;gap:0.5rem}
.topbar-back{font-size:0.78rem;font-weight:600;color:var(--text-faint);text-decoration:none;transition:color 0.2s;margin-right:0.5rem}.topbar-back:hover{color:#fff}
.xp-pill{display:flex;align-items:center;gap:0.3rem;font-size:0.7rem;font-weight:800;padding:0.3rem 0.65rem;border-radius:100px}
.xp-pill.level{background:linear-gradient(135deg,rgba(234,179,8,0.15),rgba(234,179,8,0.05));color:var(--gold);border:1px solid rgba(234,179,8,0.15)}
.xp-pill.points{background:linear-gradient(135deg,rgba(236,72,153,0.15),rgba(236,72,153,0.05));color:var(--pink);border:1px solid rgba(236,72,153,0.15)}
@media(max-width:600px){.topbar-tag{display:none}.topbar-back span{display:none}.topbar{padding:0.6rem 1rem}}

/* ══ HERO / PROGRESS ══ */
.hero-progress{text-align:center;padding:3rem 1.5rem 1.5rem;position:relative;z-index:1}
.hero-ring{position:relative;width:130px;height:130px;margin:0 auto 1.25rem}
.hero-ring svg{width:130px;height:130px;transform:rotate(-90deg)}
.hero-ring .rbg{fill:none;stroke:rgba(255,255,255,0.06);stroke-width:5}
.hero-ring .rfill{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 0.8s cubic-bezier(0.16,1,0.3,1)}
.hero-pct{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2.2rem;font-weight:900;background:linear-gradient(135deg,var(--blue),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-label{font-size:0.72rem;color:var(--text-faint);font-weight:700;letter-spacing:0.12em;text-transform:uppercase}
.hero-sub{font-size:0.85rem;color:rgba(255,255,255,0.45);margin-top:0.4rem}
@media(max-width:600px){.hero-progress{padding:2rem 1rem 1rem}.hero-ring{width:110px;height:110px}.hero-ring svg{width:110px;height:110px}.hero-pct{font-size:1.8rem}}

/* ══ JOURNEY MAP ══ */
.journey{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:1.5rem 0 6rem}
.journey-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.journey-svg .path-bg{fill:none;stroke:rgba(255,255,255,0.04);stroke-width:3;stroke-linecap:round}
.journey-svg .path-glow{fill:none;stroke:url(#pg);stroke-width:3;stroke-linecap:round;filter:url(#glow);transition:stroke-dashoffset 0.6s ease-out}
.jnodes{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.jw{display:flex;align-items:center;width:100%;padding:0.75rem 0}
.jw:nth-child(odd){justify-content:flex-start;padding-left:12%}
.jw:nth-child(even){justify-content:flex-end;padding-right:12%}
@media(min-width:601px){.jw:nth-child(odd){padding-left:8%}.jw:nth-child(even){padding-right:8%}}
.jn{display:flex;flex-direction:column;align-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative;transition:transform 0.15s}
.jn:active{transform:scale(0.94)}.jn:hover .jc{filter:brightness(1.1)}
.jc{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;position:relative;transition:all 0.3s}
@media(max-width:600px){.jc{width:60px;height:60px;font-size:1.1rem}}
.jn.locked .jc{background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.15);border:2px dashed rgba(255,255,255,0.08)}
.jn.locked .jl{color:rgba(255,255,255,0.25)}.jn.locked{cursor:default}
.jn.done .jc{background:linear-gradient(145deg,#059669,#10b981);color:#fff;border:none;box-shadow:0 4px 20px rgba(5,150,105,0.3),inset 0 1px 0 rgba(255,255,255,0.2)}
.jn.done .jc::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(5,150,105,0.2)}.jn.done .jl{color:rgba(5,150,105,0.8)}
.jn.current .jc{background:linear-gradient(145deg,#2563EB,#3b82f6);color:#fff;border:none;box-shadow:0 4px 30px rgba(37,99,235,0.4),inset 0 1px 0 rgba(255,255,255,0.2);animation:pulse 2.5s ease-in-out infinite}
.jn.current .jl{color:#fff;font-weight:800}
.jn.current .jc::before{content:'';position:absolute;inset:-9px;border-radius:50%;border:2px solid transparent;border-top-color:var(--pink);border-right-color:var(--blue);animation:orbit 3s linear infinite}
.jn.current .jc::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(37,99,235,0.4);animation:beacon 2s ease-out infinite}
.jn.mile .jc{width:78px;height:78px;font-size:1.35rem}
@media(max-width:600px){.jn.mile .jc{width:70px;height:70px;font-size:1.2rem}}
.jn.mile.done .jc{background:linear-gradient(145deg,#eab308,#f59e0b);box-shadow:0 4px 30px rgba(234,179,8,0.35),inset 0 1px 0 rgba(255,255,255,0.25)}.jn.mile.done .jl{color:rgba(234,179,8,0.8)}
.jl{font-size:0.7rem;font-weight:700;color:rgba(255,255,255,0.5);margin-top:0.5rem;text-align:center;max-width:130px;line-height:1.3;transition:color 0.3s}
@media(min-width:601px){.jl{font-size:0.75rem;max-width:160px}}
@keyframes pulse{0%,100%{box-shadow:0 4px 25px rgba(37,99,235,0.35)}50%{box-shadow:0 4px 45px rgba(37,99,235,0.6)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes beacon{0%{transform:scale(1);opacity:0.6}100%{transform:scale(1.7);opacity:0}}

/* ══ FLASHCARD LESSON ══ */
.fc-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;display:none;flex-direction:column;background:#f1f5f9}
.fc-overlay.open{display:flex}

/* Top bar */
.fc-bar{display:flex;align-items:center;gap:0.75rem;padding:0.75rem 1rem;background:#fff;border-bottom:1px solid #e2e8f0;flex-shrink:0}
.fc-back{background:none;border:none;font-size:1.15rem;color:var(--text-sec);cursor:pointer;padding:0.4rem;display:flex;align-items:center}
.fc-title{font-size:0.82rem;font-weight:800;color:var(--text);flex:1;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-counter{font-size:0.7rem;font-weight:800;color:var(--text-sec);white-space:nowrap}

/* Progress bar */
.fc-progress{height:4px;background:#e2e8f0;flex-shrink:0}
.fc-progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--pink));border-radius:0 2px 2px 0;transition:width 0.35s ease-out}

/* Card area */
.fc-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:1.5rem;position:relative;overflow:hidden}
@media(max-width:600px){.fc-stage{padding:1rem 0.75rem}}

.fc-card{background:#fff;border-radius:20px;box-shadow:0 8px 40px rgba(0,0,0,0.08),0 2px 8px rgba(0,0,0,0.04);width:100%;max-width:640px;max-height:calc(100vh - 160px);overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;animation:cardIn 0.3s cubic-bezier(0.16,1,0.3,1)}
@keyframes cardIn{from{opacity:0;transform:scale(0.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}

.fc-card-accent{height:5px;border-radius:20px 20px 0 0}
.fc-card-body{padding:2rem}
@media(max-width:600px){.fc-card-body{padding:1.5rem 1.25rem}}

/* Card type: overview */
.fc-card-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:#fff;margin-bottom:1.25rem}
.fc-card-label{font-size:0.65rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--blue);margin-bottom:0.5rem}
.fc-card-h{font-size:1.35rem;font-weight:900;color:var(--text);line-height:1.3;margin-bottom:1rem}
@media(max-width:600px){.fc-card-h{font-size:1.15rem}}
.fc-card-overview{font-size:0.92rem;line-height:1.8;color:var(--text-sec)}

/* Card type: content */
.fc-card .mc{opacity:1;transform:none;animation:none}
.fc-card .mc h4{display:none}
.fc-card .mc p{font-size:0.9rem;line-height:1.8;color:#374151;margin-bottom:1rem}
.fc-card .mc ul,.fc-card .mc ol{margin:0.5rem 0 1.25rem 1.1rem;font-size:0.9rem;line-height:1.8;color:#374151}
.fc-card .mc li{margin-bottom:0.35rem;list-style:disc}
.fc-card .mc strong{color:var(--text);font-weight:700}
.fc-card .mc em{color:var(--pink);font-style:normal;font-weight:600}
.fc-card .mc code{background:#f1f5f9;padding:0.15rem 0.5rem;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:0.8rem;color:var(--blue);word-break:break-all;white-space:pre-wrap}

/* Card type: quiz */
.fc-card .qqt{font-size:0.92rem;font-weight:700;color:var(--text);margin-bottom:1.25rem;line-height:1.5}
.fc-card .qos{display:flex;flex-direction:column;gap:0.5rem}
.fc-card .qo{padding:0.85rem 1rem;border-radius:12px;border:2px solid #e2e8f0;background:#fff;font-size:0.86rem;color:#374151;cursor:pointer;transition:all 0.25s;display:flex;align-items:center;gap:0.75rem;min-height:48px}
.fc-card .qo:hover{border-color:var(--blue);background:rgba(37,99,235,0.03)}
.fc-card .qo .qr{width:22px;height:22px;border-radius:50%;border:2px solid #d1d5db;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.25s;font-size:0.55rem}
.fc-card .qo.ok{border-color:var(--green);background:rgba(5,150,105,0.06)}.fc-card .qo.ok .qr{border-color:var(--green);background:var(--green);color:#fff}
.fc-card .qo.no{border-color:#ef4444;background:rgba(239,68,68,0.04)}.fc-card .qo.no .qr{border-color:#ef4444;background:#ef4444;color:#fff}
.fc-card .qo.dim{opacity:0.45;pointer-events:none}
.fc-card .qe{margin-top:0.5rem;padding:0;border-radius:10px;background:rgba(5,150,105,0.06);border-left:3px solid var(--green);font-size:0.82rem;line-height:1.6;color:#374151;max-height:0;overflow:hidden;opacity:0;transition:all 0.4s}
.fc-card .qe.show{max-height:300px;opacity:1;padding:0.75rem 1rem;margin-top:0.75rem}

/* Card type: complete */
.fc-card-done{text-align:center;padding:3rem 2rem}
.fc-card-done-icon{font-size:3.5rem;margin-bottom:1rem}
.fc-card-done h3{font-size:1.3rem;font-weight:900;color:var(--text);margin-bottom:0.5rem}
.fc-card-done p{font-size:0.9rem;color:var(--text-sec);line-height:1.6;margin-bottom:1.5rem}
.fc-finish-btn{display:block;width:100%;padding:1rem;border:none;border-radius:14px;font-family:'Montserrat',sans-serif;font-size:0.95rem;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--blue),#3b82f6);cursor:pointer;box-shadow:0 4px 20px rgba(37,99,235,0.3);transition:all 0.2s}
.fc-finish-btn:hover{transform:translateY(-2px)}.fc-finish-btn:active{transform:scale(0.97)}
.fc-finish-btn.is-done{background:var(--green);box-shadow:0 4px 20px rgba(5,150,105,0.3)}

/* Navigation */
.fc-nav{display:flex;align-items:center;justify-content:space-between;padding:0.75rem 1rem;background:#fff;border-top:1px solid #e2e8f0;flex-shrink:0}
.fc-nav-btn{display:flex;align-items:center;gap:0.4rem;padding:0.7rem 1.25rem;border:none;border-radius:100px;font-family:'Montserrat',sans-serif;font-size:0.8rem;font-weight:700;cursor:pointer;transition:all 0.2s}
.fc-nav-prev{background:#f1f5f9;color:#374151}.fc-nav-prev:hover{background:#e2e8f0}
.fc-nav-prev:disabled{opacity:0.3;cursor:default}
.fc-nav-next{background:var(--blue);color:#fff;box-shadow:0 2px 10px rgba(37,99,235,0.2)}.fc-nav-next:hover{box-shadow:0 4px 20px rgba(37,99,235,0.35)}

/* Dots */
.fc-dots{display:flex;gap:4px;align-items:center;justify-content:center;overflow-x:auto;max-width:200px;padding:0 0.5rem}
.fc-dot{width:6px;height:6px;border-radius:50%;background:#d1d5db;transition:all 0.3s;flex-shrink:0}
.fc-dot.active{background:var(--blue);width:18px;border-radius:3px}
.fc-dot.quiz{background:#e2e8f0;border:1px solid #d1d5db}
.fc-dot.quiz.active{background:var(--pink);border-color:var(--pink)}

/* Swipe hint */
.fc-swipe-hint{text-align:center;padding:0.5rem;font-size:0.65rem;color:var(--text-sec);opacity:0.5;flex-shrink:0}

/* ══ CELEBRATION ══ */
.celebrate{position:fixed;top:0;left:0;right:0;bottom:0;z-index:400;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(6,8,15,0.92);backdrop-filter:blur(16px)}
.celebrate.show{display:flex}
.celebrate-icon{font-size:5rem;animation:bounceIn 0.6s ease}
.celebrate-title{font-size:1.8rem;font-weight:900;color:#fff;margin:1rem 0 0.5rem}
.celebrate-sub{font-size:0.95rem;color:var(--text-lt);margin-bottom:0.75rem}
.celebrate-xp{font-size:1.4rem;font-weight:900;color:var(--pink);margin-bottom:2.5rem}
.celebrate-btn{padding:1rem 3rem;border:none;border-radius:100px;font-family:'Montserrat',sans-serif;font-size:0.95rem;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--green),#10b981);cursor:pointer;box-shadow:0 4px 25px rgba(5,150,105,0.3);transition:transform 0.2s}
.celebrate-btn:hover{transform:translateY(-2px)}
@keyframes bounceIn{0%{transform:scale(0);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.confetti-wrap{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:401;overflow:hidden}
.confetti{position:absolute;top:-10px;animation:cfall linear forwards}
@keyframes cfall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* ══ GATE ══ */
.gate{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(6,8,15,0.95);backdrop-filter:blur(20px);z-index:300;display:none;align-items:center;justify-content:center;padding:2rem}.gate.show{display:flex}
.gc{max-width:420px;text-align:center;background:rgba(22,29,46,0.95);border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:3rem 2.5rem}
.gc-i{font-size:3rem;color:var(--pink);margin-bottom:1.5rem}.gc h2{font-size:1.4rem;font-weight:900;margin-bottom:0.75rem}.gc p{color:var(--text-lt);font-size:0.9rem;line-height:1.7;margin-bottom:2rem}
.gc-b{width:100%;padding:1rem;border:none;border-radius:12px;font-family:'Montserrat',sans-serif;font-size:0.95rem;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--blue),#3b82f6);cursor:pointer;box-shadow:0 4px 15px rgba(37,99,235,0.3)}
.gc-s{font-size:0.75rem;color:var(--text-faint);margin-top:1rem}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div class="stars" id="starField"></div>
<div class="topbar">
    <div class="topbar-left"><a href="ai.html" class="topbar-logo"><span class="c1">COCO</span><span class="c2">CORP</span></a><div class="topbar-tag">Training Portal</div></div>
    <div class="topbar-right"><a href="ai.html" class="topbar-back"><i class="fas fa-arrow-left" style="margin-right:0.4rem"></i><span>Back to AI</span></a><div class="xp-pill level"><i class="fas fa-trophy" style="font-size:0.55rem"></i> <span id="lvlText">Lv 1</span></div><div class="xp-pill points"><i class="fas fa-bolt" style="font-size:0.55rem"></i> <span id="xpText">0 XP</span></div></div>
</div>
<div class="gate" id="pGate"><div class="gc"><div class="gc-i"><i class="fas fa-lock"></i></div><h2>Unlock Full Access</h2><p>You've previewed the first module. Unlock all 12 modules, quizzes, and the final exam.</p><button class="gc-b" onclick="unlk=true;document.getElementById('pGate').classList.remove('show');rJourney()">Unlock Now (Coming Soon)</button><p class="gc-s">Payment integration will be added here.</p></div></div>

<div class="hero-progress">
    <div class="hero-ring"><svg viewBox="0 0 130 130"><defs><linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#EC4899"/></linearGradient></defs><circle class="rbg" cx="65" cy="65" r="56"/><circle class="rfill" id="heroRing" cx="65" cy="65" r="56" stroke="url(#hg)" stroke-dasharray="351.86" stroke-dashoffset="351.86"/></svg><div class="hero-pct" id="heroPct">0%</div></div>
    <div class="hero-label">Your AI Learning Journey</div>
    <div class="hero-sub" id="heroSub">Start your first lesson below</div>
</div>

<div class="journey" id="journeyWrap">
    <svg class="journey-svg" id="jSvg"><defs><linearGradient id="pg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#2563EB"/><stop offset="50%" stop-color="#EC4899"/><stop offset="100%" stop-color="#059669"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs></svg>
    <div class="jnodes" id="jNodes"></div>
</div>

<!-- Flashcard Lesson -->
<div class="fc-overlay" id="fcOv">
    <div class="fc-bar"><button class="fc-back" onclick="closeLesson()"><i class="fas fa-times"></i></button><div class="fc-title" id="fcTitle"></div><div class="fc-counter" id="fcCounter">1 / 5</div></div>
    <div class="fc-progress"><div class="fc-progress-fill" id="fcFill"></div></div>
    <div class="fc-stage" id="fcStage"></div>
    <div class="fc-nav">
        <button class="fc-nav-btn fc-nav-prev" id="fcPrev" onclick="fcGo(-1)"><i class="fas fa-arrow-left"></i> Back</button>
        <div class="fc-dots" id="fcDots"></div>
        <button class="fc-nav-btn fc-nav-next" id="fcNext" onclick="fcGo(1)">Next <i class="fas fa-arrow-right"></i></button>
    </div>
    <div class="fc-swipe-hint" id="fcHint">Swipe or use arrows to navigate</div>
</div>

<!-- Celebration -->
<div class="celebrate" id="celeb"><div class="celebrate-icon" id="celebIcon"></div><div class="celebrate-title" id="celebTitle"></div><div class="celebrate-sub" id="celebSub"></div><div class="celebrate-xp" id="celebXp"></div><button class="celebrate-btn" onclick="closeCeleb()">Continue</button></div>
<div class="confetti-wrap" id="confWrap"></div>

<script>
var M=[],cur=0,done=new Set(),unlk=true,xp=0;
var ICONS=['fa-brain','fa-compass','fa-microchip','fa-keyboard','fa-shield-halved','fa-wand-magic-sparkles','fa-gears','fa-code','fa-chart-line','fa-users-gear','fa-clipboard-check','fa-trophy'];
var ACCENTS=['#2563EB','#EC4899','#059669','#eab308','#8b5cf6','#f97316','#06b6d4','#ef4444','#2563EB','#EC4899','#059669','#eab308'];
try{var s=localStorage.getItem('cc_prog');if(s)done=new Set(JSON.parse(s))}catch(e){}
try{var x=localStorage.getItem('cc_xp');if(x)xp=parseInt(x)||0}catch(e){}
function sv(){try{localStorage.setItem('cc_prog',JSON.stringify([...done]));localStorage.setItem('cc_xp',String(xp))}catch(e){}}
function addXp(n){xp+=n;sv();updateStats()}
function getLevel(){if(xp>=200)return 5;if(xp>=120)return 4;if(xp>=60)return 3;if(xp>=20)return 2;return 1}
function pct(){return M.length?Math.round(done.size/M.length*100):0}
function getState(i){if(done.has(i))return'done';for(var j=0;j<i;j++){if(!done.has(j))return'locked'}return'current'}

function makeStars(){var el=document.getElementById('starField');var h='';for(var i=0;i<80;i++){var sz=Math.random()*2+0.5;var tw=Math.random()>0.55;h+='<div class="star'+(tw?' tw':'')+'" style="left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+sz+'px;height:'+sz+'px;opacity:'+(Math.random()*0.5+0.1)+';'+(tw?'animation-duration:'+(Math.random()*3+2)+'s;animation-delay:'+(Math.random()*3)+'s':'')+'"></div>'}el.innerHTML=h}

function updateStats(){
    var p=pct(),ci=2*Math.PI*56;
    document.getElementById('heroPct').textContent=p+'%';
    document.getElementById('heroRing').style.strokeDashoffset=ci-(ci*p/100);
    document.getElementById('xpText').textContent=xp+' XP';
    document.getElementById('lvlText').textContent='Lv '+getLevel();
    var d=done.size;
    document.getElementById('heroSub').textContent=d===0?'Start your first lesson below':d===M.length?'You completed every module!':d+' of '+M.length+' lessons complete';
}

async function init(){
    makeStars();
    try{var r=await fetch('data/data.json');M=await r.json();rJourney();updateStats()}
    catch(e){document.getElementById('jNodes').innerHTML='<p style="color:#ef4444;text-align:center;padding:4rem">Failed to load modules. Please refresh.</p>'}
}

/* ══ JOURNEY MAP ══ */
function rJourney(){
    var h='';
    M.forEach(function(m,i){
        var st=getState(i);var mile=(i+1)%4===0;var cls='jn '+st+(mile?' mile':'');
        var icon;if(st==='done')icon=mile?'<i class="fas fa-star"></i>':'<i class="fas fa-check"></i>';else if(st==='current')icon='<i class="fas fa-play" style="font-size:0.85rem;margin-left:2px"></i>';else icon='<i class="fas '+(ICONS[i]||'fa-circle')+'" style="opacity:0.3;font-size:0.9rem"></i>';
        var label=(m.navTitle||m.title).replace(/^\d+\.\s*/,'');
        h+='<div class="jw"><div class="'+cls+'" onclick="openLesson('+i+')"><div class="jc">'+icon+'</div><div class="jl">'+label+'</div></div></div>';
    });
    document.getElementById('jNodes').innerHTML=h;
    requestAnimationFrame(function(){requestAnimationFrame(drawPath)});
    updateStats();
}

function drawPath(){
    var wraps=document.querySelectorAll('.jw');if(wraps.length<2)return;
    var svg=document.getElementById('jSvg');var container=document.getElementById('journeyWrap');var cRect=container.getBoundingClientRect();
    var h=container.scrollHeight;svg.setAttribute('viewBox','0 0 '+cRect.width+' '+h);svg.style.width=cRect.width+'px';svg.style.height=h+'px';
    var pts=[];wraps.forEach(function(w){var c=w.querySelector('.jc');var r=c.getBoundingClientRect();pts.push({x:r.left-cRect.left+r.width/2,y:r.top-cRect.top+r.height/2})});
    var d='M '+pts[0].x+' '+pts[0].y;for(var i=1;i<pts.length;i++){var p=pts[i-1],c=pts[i],cy=(p.y+c.y)/2;d+=' C '+p.x+' '+cy+', '+c.x+' '+cy+', '+c.x+' '+c.y}
    svg.querySelectorAll('.path-bg,.path-glow').forEach(function(p){p.remove()});
    var bg=document.createElementNS('http://www.w3.org/2000/svg','path');bg.setAttribute('d',d);bg.setAttribute('class','path-bg');svg.appendChild(bg);
    var totalLen=bg.getTotalLength();var doneCount=0;for(var i=0;i<M.length;i++){if(done.has(i))doneCount++;else break}var frac=M.length>1?doneCount/(M.length-1):0;
    var gp=document.createElementNS('http://www.w3.org/2000/svg','path');gp.setAttribute('d',d);gp.setAttribute('class','path-glow');gp.style.strokeDasharray=totalLen;gp.style.strokeDashoffset=totalLen-(totalLen*frac);svg.appendChild(gp);
}
window.addEventListener('resize',function(){requestAnimationFrame(drawPath)});

/* ══ FLASHCARD LESSON ══ */
var cards=[],cardIdx=0,fcModIdx=0;

function parseCards(m,mi){
    var result=[];
    var accent=ACCENTS[mi%ACCENTS.length];
    // Card 0: Overview
    result.push({type:'overview',title:m.title,overview:m.overview,accent:accent,icon:ICONS[mi]||'fa-book-open'});
    // Content cards: split on <h4>
    if(m.coreContent){
        var parts=m.coreContent.split(/<h4>/i);
        for(var i=0;i<parts.length;i++){
            var chunk=parts[i].trim();if(!chunk)continue;
            var title='',body=chunk;
            var closeTag=chunk.indexOf('</h4>');
            if(closeTag>-1&&i>0){title=chunk.substring(0,closeTag).replace(/<[^>]*>/g,'');body=chunk.substring(closeTag+5)}
            else if(i===0){title='Introduction';body=chunk}
            if(body.trim())result.push({type:'content',title:title,body:body,accent:accent});
        }
    }
    // Quiz cards: one per question
    if(m.quiz&&m.quiz.questions){
        m.quiz.questions.forEach(function(q,qi){
            result.push({type:'quiz',question:q,qIdx:qi,modIdx:mi,accent:accent,total:m.quiz.questions.length});
        });
    }
    // Final card: complete
    result.push({type:'complete',modIdx:mi,accent:accent});
    return result;
}

function renderCard(c,idx,total){
    var h='<div class="fc-card" id="fcCard"><div class="fc-card-accent" style="background:'+c.accent+'"></div><div class="fc-card-body">';
    if(c.type==='overview'){
        h+='<div class="fc-card-icon" style="background:'+c.accent+'"><i class="fas '+c.icon+'"></i></div>';
        h+='<div class="fc-card-label">Module Overview</div>';
        h+='<div class="fc-card-h">'+c.title+'</div>';
        h+='<div class="fc-card-overview">'+c.overview+'</div>';
    } else if(c.type==='content'){
        h+='<div class="fc-card-label" style="color:'+c.accent+'">'+c.title+'</div>';
        h+='<div class="mc">'+c.body+'</div>';
    } else if(c.type==='quiz'){
        var uid=c.modIdx+'_'+c.qIdx;
        h+='<div class="fc-card-label" style="color:var(--pink)"><i class="fas fa-brain" style="margin-right:0.3rem"></i>Question '+(c.qIdx+1)+' of '+c.total+'</div>';
        h+='<div class="qqt">'+c.question.question+'</div><div class="qos">';
        c.question.options.forEach(function(opt){
            h+='<div class="qo" data-qi="'+uid+'" data-ok="'+(opt===c.question.answer)+'" onclick="chk(this,\''+uid+'\')"><div class="qr"></div><span>'+opt+'</span></div>';
        });
        h+='</div><div class="qe" id="e'+uid+'">'+(c.question.explanation||'')+'</div>';
    } else if(c.type==='complete'){
        var isDone=done.has(c.modIdx);
        h+='<div class="fc-card-done"><div class="fc-card-done-icon">'+(isDone?'\u2705':'\uD83C\uDF1F')+'</div>';
        h+='<h3>'+(isDone?'Already Completed':'Ready to Complete?')+'</h3>';
        h+='<p>'+(isDone?'You\'ve already earned XP for this module.':'You\'ve reviewed all the content and answered the quiz. Mark this lesson as complete to earn your XP.')+'</p>';
        h+='<button class="fc-finish-btn'+(isDone?' is-done':'')+'" onclick="lessonFin('+c.modIdx+')">'+(isDone?'<i class="fas fa-check" style="margin-right:0.4rem"></i>Completed':'Complete & Earn +10 XP  <i class="fas fa-bolt" style="margin-left:0.3rem"></i>')+'</button></div>';
    }
    h+='</div></div>';
    return h;
}

function openLesson(i){
    if(getState(i)==='locked')return;
    var m=M[i];fcModIdx=i;
    cards=parseCards(m,i);cardIdx=0;
    document.getElementById('fcTitle').textContent=(m.navTitle||m.title).replace(/^\d+\.\s*/,'');
    showCard();
    document.getElementById('fcOv').classList.add('open');
    document.body.style.overflow='hidden';
    // Hide hint after first interaction
    document.getElementById('fcHint').style.display='';
}

function showCard(){
    var stage=document.getElementById('fcStage');
    stage.innerHTML=renderCard(cards[cardIdx],cardIdx,cards.length);
    // Counter
    document.getElementById('fcCounter').textContent=(cardIdx+1)+' / '+cards.length;
    // Progress
    document.getElementById('fcFill').style.width=((cardIdx+1)/cards.length*100)+'%';
    // Dots
    var dots='';for(var i=0;i<cards.length;i++){var cls='fc-dot';if(i===cardIdx)cls+=' active';if(cards[i].type==='quiz')cls+=' quiz';dots+='<div class="'+cls+'"></div>'}
    document.getElementById('fcDots').innerHTML=dots;
    // Prev/Next
    document.getElementById('fcPrev').disabled=cardIdx===0;
    var nextBtn=document.getElementById('fcNext');
    if(cardIdx===cards.length-1){nextBtn.style.visibility='hidden'}else{nextBtn.style.visibility='';nextBtn.innerHTML='Next <i class="fas fa-arrow-right"></i>'}
    // Scroll card to top
    var card=document.getElementById('fcCard');if(card)card.scrollTop=0;
}

function fcGo(dir){
    var next=cardIdx+dir;
    if(next<0||next>=cards.length)return;
    cardIdx=next;showCard();
    document.getElementById('fcHint').style.display='none';
}

function closeLesson(){
    document.getElementById('fcOv').classList.remove('open');
    document.body.style.overflow='';rJourney();
}

function lessonFin(i){
    if(done.has(i)){closeLesson();return}
    done.add(i);addXp(10);sv();
    setTimeout(function(){document.getElementById('fcOv').classList.remove('open');showCeleb(i)},300);
}

function chk(el,uid){
    var os=document.querySelectorAll('[data-qi="'+uid+'"]');var ans=false;os.forEach(function(o){if(o.classList.contains('ok')||o.classList.contains('no'))ans=true});if(ans)return;
    if(el.dataset.ok==='true')addXp(5);
    os.forEach(function(o){if(o.dataset.ok==='true'){o.classList.add('ok');o.querySelector('.qr').innerHTML='<i class="fas fa-check"></i>'}else if(o===el){o.classList.add('no');o.querySelector('.qr').innerHTML='<i class="fas fa-times"></i>'}else o.classList.add('dim')});
    document.getElementById('e'+uid).classList.add('show');
}

/* Touch swipe */
(function(){
    var sx=0,sy=0;
    var stage=document.getElementById('fcStage');
    stage.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
    stage.addEventListener('touchend',function(e){
        var dx=e.changedTouches[0].clientX-sx;
        var dy=e.changedTouches[0].clientY-sy;
        if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>50){fcGo(dx<0?1:-1)}
    },{passive:true});
    // Keyboard
    document.addEventListener('keydown',function(e){
        if(!document.getElementById('fcOv').classList.contains('open'))return;
        if(e.key==='ArrowRight'||e.key==='ArrowDown')fcGo(1);
        if(e.key==='ArrowLeft'||e.key==='ArrowUp')fcGo(-1);
        if(e.key==='Escape')closeLesson();
    });
})();

/* ══ CELEBRATION ══ */
function showCeleb(i){
    var all=done.size===M.length;
    document.getElementById('celebIcon').textContent=all?'\uD83C\uDF93':'\uD83C\uDF1F';
    document.getElementById('celebTitle').textContent=all?'Course Complete!':'Lesson Complete!';
    document.getElementById('celebSub').textContent=all?'You mastered all '+M.length+' modules.':'Module '+(i+1)+' of '+M.length+' done.';
    document.getElementById('celebXp').textContent='+10 XP earned';
    document.getElementById('celeb').classList.add('show');fireConfetti();
}
function closeCeleb(){
    document.getElementById('celeb').classList.remove('show');document.body.style.overflow='';rJourney();
    var next=-1;for(var j=0;j<M.length;j++){if(!done.has(j)){next=j;break}}
    if(next>=0){var wraps=document.querySelectorAll('.jw');if(wraps[next])setTimeout(function(){wraps[next].scrollIntoView({behavior:'smooth',block:'center'})},250)}
}
function fireConfetti(){
    var w=document.getElementById('confWrap');w.innerHTML='';
    var cols=['#EC4899','#2563EB','#059669','#eab308','#f97316','#8b5cf6','#06b6d4','#fff'];
    for(var i=0;i<70;i++){var p=document.createElement('div');p.className='confetti';p.style.left=Math.random()*100+'%';p.style.background=cols[Math.floor(Math.random()*cols.length)];var sz=Math.random()*8+4;p.style.width=sz+'px';p.style.height=sz+'px';p.style.borderRadius=Math.random()>0.5?'50%':'2px';p.style.animationDuration=(Math.random()*2+1.5)+'s';p.style.animationDelay=(Math.random()*0.6)+'s';w.appendChild(p)}
    setTimeout(function(){w.innerHTML=''},4500);
}

init();
</script>
